<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 330" font-family="-apple-system, Segoe UI, Helvetica, Arial, sans-serif">
  <style>
    .bg{fill:#ffffff}.card{fill:#f6f8fa;stroke:#d0d7de}.hi{fill:#fff8c5;stroke:#d4a72c}
    .t{fill:#1f2328;font-size:15px;font-weight:600}.s{fill:#59636e;font-size:12.5px}.m{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;fill:#1f2328;font-size:12.5px}
    .a{stroke:#8c959f;stroke-width:2;fill:none}.ah{fill:#8c959f}.d{stroke-dasharray:5 4}
    @media (prefers-color-scheme: dark){
      .bg{fill:#0d1117}.card{fill:#161b22;stroke:#30363d}.hi{fill:#2e2a0e;stroke:#9e6a03}
      .t{fill:#e6edf3}.s{fill:#9198a1}.m{fill:#e6edf3}.a{stroke:#6e7681}.ah{fill:#6e7681}
    }
  </style>
  <defs><marker id="m" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path class="ah" d="M0,0 L10,5 L0,10 z"/></marker></defs>
  <rect class="bg" width="880" height="330" rx="16"/>

  <text class="t" x="150" y="36" text-anchor="middle">Lo que editás (Obsidian)</text>
  <text class="t" x="720" y="36" text-anchor="middle">Lo que lee Claude Code</text>

  <rect class="card" x="30" y="56" width="240" height="70" rx="12"/>
  <text class="m" x="50" y="86">agentes/play-store.md</text>
  <text class="s" x="50" y="108">name · description · model</text>

  <rect class="card" x="30" y="146" width="240" height="70" rx="12"/>
  <text class="m" x="50" y="176">skills/eval.md</text>
  <text class="s" x="50" y="198">name · description</text>

  <rect class="card" x="30" y="236" width="240" height="70" rx="12"/>
