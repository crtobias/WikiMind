  <text class="s" x="50" y="288">SKILL.md + scripts</text>

  <rect class="hi" x="330" y="96" width="220" height="110" rx="12"/>
  <text class="t" x="440" y="130" text-anchor="middle">Hook SessionStart</text>
  <text class="m" x="440" y="156" text-anchor="middle">sync-links.sh</text>
  <text class="s" x="440" y="182" text-anchor="middle">crea, mueve y limpia links</text>

  <rect class="card" x="580" y="56" width="280" height="70" rx="12"/>
  <text class="m" x="598" y="86">.claude/agents/play-store.md</text>
  <text class="s" x="598" y="108">symlink · opcional → agents-opcionales/</text>

  <rect class="card" x="580" y="146" width="280" height="70" rx="12"/>
