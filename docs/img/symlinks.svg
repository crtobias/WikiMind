  <path class="a" d="M272 91 C300 91 300 130 326 136" marker-end="url(#m)"/>
  <path class="a" d="M272 181 C300 181 300 170 326 168" marker-end="url(#m)"/>
  <path class="a" d="M552 136 C566 130 562 91 576 91" marker-end="url(#m)"/>
  <path class="a" d="M552 168 C566 170 562 181 576 181" marker-end="url(#m)"/>
  <path class="a d" d="M272 271 H576" marker-end="url(#m)"/>
  <text class="s" x="440" y="262" text-anchor="middle">ln -s (una vez)</text>
