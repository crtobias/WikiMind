    <text x="790" y="88" text-anchor="middle">proyectos/</text>
    <circle cx="1070" cy="100" r="11" fill="#a78bfa"/><circle cx="1070" cy="100" r="18" fill="#a78bfa" fill-opacity="0.25" filter="url(#soft)"/>
