    <rect x="308" y="296" width="126" height="34" rx="17" fill="#ffffff" fill-opacity="0.08" stroke="#ffffff" stroke-opacity="0.18"/>
    <text x="371" y="318" text-anchor="middle" fill="#e2e8f0">Claude Code</text>
