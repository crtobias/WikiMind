  <circle cx="930" cy="205" r="34" fill="#c4b5fd" fill-opacity="0.25" filter="url(#soft)"/>
  <circle cx="930" cy="205" r="22" fill="#ffffff"/>
  <text x="930" y="211" text-anchor="middle" font-size="15" font-weight="700" fill="#4c1d95" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">wiki</text>

  <text x="80" y="170" font-size="84" font-weight="800" letter-spacing="-2" fill="#ffffff">Wiki<tspan fill="#c4b5fd">Mind</tspan></text>
  <text x="84" y="222" font-size="24" fill="#cbd5e1">La memoria que compartís con tu equipo</text>
  <text x="84" y="254" font-size="24" fill="#cbd5e1">y con tus agentes de IA.</text>

  <g font-size="15" font-weight="600">
    <rect x="84" y="296" width="104" height="34" rx="17" fill="#ffffff" fill-opacity="0.08" stroke="#ffffff" stroke-opacity="0.18"/>
