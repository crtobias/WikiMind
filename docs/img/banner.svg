    <line x1="930" y1="205" x2="1070" y2="100"/>
    <line x1="930" y1="205" x2="760" y2="260"/>
    <line x1="930" y1="205" x2="1100" y2="250"/>
    <line x1="930" y1="205" x2="900" y2="345"/>
    <line x1="790" y1="110" x2="680" y2="160"/>
    <line x1="790" y1="110" x2="860" y2="55"/>
    <line x1="1070" y1="100" x2="1180" y2="70"/>
    <line x1="1070" y1="100" x2="1000" y2="45"/>
    <line x1="1100" y1="250" x2="1200" y2="190"/>
    <line x1="1100" y1="250" x2="1060" y2="350"/>
    <line x1="760" y1="260" x2="660" y2="300"/>
    <line x1="760" y1="260" x2="780" y2="365"/>
    <line x1="900" y1="345" x2="1060" y2="350"/>
    <line x1="680" y1="160" x2="660" y2="300"/>
    <line x1="860" y1="55" x2="1000" y2="45"/>
  </g>

  <g fill="#c4b5fd">
    <circle cx="680" cy="160" r="5"/><circle cx="860" cy="55" r="5"/><circle cx="1000" cy="45" r="5"/>
    <circle cx="1180" cy="70" r="5"/><circle cx="1200" cy="190" r="5"/><circle cx="660" cy="300" r="5"/>
    <circle cx="780" cy="365" r="5"/><circle cx="1060" cy="350" r="6" fill="#67e8f9"/>
