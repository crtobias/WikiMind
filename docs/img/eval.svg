<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 300" font-family="-apple-system, Segoe UI, Helvetica, Arial, sans-serif">
  <style>
    .bg{fill:#ffffff}.card{fill:#f6f8fa;stroke:#d0d7de}.ok{fill:#dafbe1;stroke:#4ac26b}.fix{fill:#fff1e5;stroke:#fb8f44}
    .t{fill:#1f2328;font-size:15px;font-weight:600}.s{fill:#59636e;font-size:12.5px}
    .a{stroke:#8c959f;stroke-width:2;fill:none}.ah{fill:#8c959f}
    @media (prefers-color-scheme: dark){
      .bg{fill:#0d1117}.card{fill:#161b22;stroke:#30363d}.ok{fill:#0f2d1a;stroke:#2ea043}.fix{fill:#3d1d00;stroke:#bd561d}
      .t{fill:#e6edf3}.s{fill:#9198a1}.a{stroke:#6e7681}.ah{fill:#6e7681}
    }
  </style>
  <defs><marker id="m" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path class="ah" d="M0,0 L10,5 L0,10 z"/></marker></defs>
  <rect class="bg" width="880" height="300" rx="16"/>

  <rect class="card" x="20" y="40" width="170" height="100" rx="12"/>
  <text class="t" x="105" y="76" text-anchor="middle">Examen</text>
  <text class="s" x="105" y="100" text-anchor="middle">3–5 tareas reales</text>
  <text class="s" x="105" y="120" text-anchor="middle">criterios sí / no</text>

  <rect class="card" x="230" y="40" width="190" height="100" rx="12"/>
  <text class="t" x="325" y="76" text-anchor="middle">3 ejecutores</text>
  <text class="s" x="325" y="100" text-anchor="middle">siguen el .md en simulacro</text>
  <text class="s" x="325" y="120" text-anchor="middle">no ven los criterios</text>

  <rect class="card" x="460" y="40" width="190" height="100" rx="12"/>
  <text class="t" x="555" y="76" text-anchor="middle">Evaluador</text>
  <text class="s" x="555" y="100" text-anchor="middle">pone nota por criterio</text>
  <text class="s" x="555" y="120" text-anchor="middle">no ve el .md</text>

  <rect class="ok" x="690" y="40" width="170" height="100" rx="12"/>
  <text class="t" x="775" y="80" text-anchor="middle">10/10</text>
  <text class="s" x="775" y="106" text-anchor="middle">listo</text>

  <rect class="fix" x="345" y="190" width="300" height="80" rx="12"/>
  <text class="t" x="495" y="222" text-anchor="middle">Mejora el .md</text>
  <text class="s" x="495" y="246" text-anchor="middle">cambio mínimo y general · máx. 5 rondas</text>

  <path class="a" d="M192 90 H226" marker-end="url(#m)"/>
  <path class="a" d="M422 90 H456" marker-end="url(#m)"/>
  <path class="a" d="M652 90 H686" marker-end="url(#m)"/>
  <path class="a" d="M600 142 C600 165 580 175 560 186" marker-end="url(#m)"/>
  <text class="s" x="640" y="172">&lt; 10</text>
  <path class="a" d="M345 230 C290 230 325 170 325 146" marker-end="url(#m)"/>
  <text class="s" x="300" y="215" text-anchor="end">otra ronda</text>
</svg>
